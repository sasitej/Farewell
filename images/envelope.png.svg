<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">

<defs>

<linearGradient id="paper" x1="0%" y1="0%" x2="100%" y2="100%">

<stop offset="0%" stop-color="#fffef8"></stop>
<stop offset="100%" stop-color="#efe8dc"></stop>

</linearGradient>

<filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">

<feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity=".35"></feDropShadow>

</filter>

</defs>

<rect x="120" y="130" width="660" height="340" rx="10" fill="url(#paper)" filter="url(#shadow)"></rect>

<polygon points="120,130 450,310 780,130" fill="#faf6ef"></polygon>

<polygon points="120,470 450,300 780,470" fill="#e8dfd2"></polygon>

<polygon points="120,130 120,470 450,300" fill="#f4eee3"></polygon>

<polygon points="780,130 780,470 450,300" fill="#f4eee3"></polygon>

</svg>